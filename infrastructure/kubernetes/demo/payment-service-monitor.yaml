apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor

metadata:
  name: payment-service
  namespace: infrapilot-demo

  labels:
    release: monitoring

spec:
  selector:
    matchLabels:
      app: payment-service

  namespaceSelector:
    matchNames:
      - infrapilot-demo

  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      