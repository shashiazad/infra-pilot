apiVersion: apps/v1
kind: Deployment

metadata:
  name: prod-demo-payment
  namespace: prod-demo

spec:
  replicas: 2

  selector:
    matchLabels:
      app: prod-demo-payment

  template:
    metadata:
      labels:
        app: prod-demo-payment

    spec:
      containers:
        - name: prod-demo-payment

          image: prod-demo/payment:latest

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080
              name: http

          readinessProbe:
            httpGet:
              path: /health
              port: 8080

            initialDelaySeconds: 2
            periodSeconds: 5

---
apiVersion: v1
kind: Service

metadata:
  name: prod-demo-payment
  namespace: prod-demo

  labels:
    app: prod-demo-payment

spec:
  selector:
    app: prod-demo-payment

  ports:
    - name: http
      port: 8080
      targetPort: 8080
