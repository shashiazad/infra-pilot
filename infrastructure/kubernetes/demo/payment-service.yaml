apiVersion: apps/v1
kind: Deployment

metadata:
  name: payment-service
  namespace: infrapilot-demo

spec:
  replicas: 2

  selector:
    matchLabels:
      app: payment-service

  template:
    metadata:
      labels:
        app: payment-service

    spec:
      containers:
        - name: payment-service

          image: infrapilot/payment-service:latest

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080
              name: http

          readinessProbe:
            httpGet:
              path: /health
              port: 8080

            initialDelaySeconds: 2
            periodSeconds: 5

---
apiVersion: v1
kind: Service

metadata:
  name: payment-service
  namespace: infrapilot-demo

  labels:
    app: payment-service

spec:
  selector:
    app: payment-service

  ports:
    - name: http
      port: 8080
      targetPort: 8080