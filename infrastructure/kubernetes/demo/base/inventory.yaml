apiVersion: apps/v1
kind: Deployment
metadata:
  name: prod-demo-inventory
  namespace: prod-demo

spec:
  replicas: 2

  selector:
    matchLabels:
      app: prod-demo-inventory

  template:
    metadata:
      labels:
        app: prod-demo-inventory

    spec:
      containers:
        - name: prod-demo-inventory
          image: prod-demo/inventory:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080

          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: prod-demo-inventory
  namespace: prod-demo
  labels:
    app: prod-demo-inventory

spec:
  selector:
    app: prod-demo-inventory

  ports:
    - name: http
      port: 8080
      targetPort: 8080
