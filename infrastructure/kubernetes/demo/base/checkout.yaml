apiVersion: apps/v1
kind: Deployment
metadata:
  name: prod-demo-checkout
  namespace: prod-demo

spec:
  replicas: 2

  selector:
    matchLabels:
      app: prod-demo-checkout

  template:
    metadata:
      labels:
        app: prod-demo-checkout

    spec:
      containers:
        - name: prod-demo-checkout
          image: prod-demo/checkout:latest
          imagePullPolicy: IfNotPresent

          env:
            - name: PAYMENT_URL
              value: http://prod-demo-payment:8080

            - name: INVENTORY_URL
              value: http://prod-demo-inventory:8080

          ports:
            - name: http
              containerPort: 8080

          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: prod-demo-checkout
  namespace: prod-demo
  labels:
    app: prod-demo-checkout

spec:
  selector:
    app: prod-demo-checkout

  ports:
    - name: http
      port: 8080
      targetPort: 8080
