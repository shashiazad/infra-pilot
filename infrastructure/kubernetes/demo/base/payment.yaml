apiVersion: apps/v1
kind: Deployment
metadata:
  name: prod-demo-payment
  namespace: prod-demo

spec:
  replicas: 2

  selector:
    matchLabels:
      app: prod-demo-payment

  template:
    metadata:
      labels:
        app: prod-demo-payment

    spec:
      containers:
        - name: prod-demo-payment
          image: prod-demo/payment:latest
          imagePullPolicy: IfNotPresent

          env:
            - name: DB_HOST
              value: prod-demo-postgres

            - name: DB_PORT
              value: "5432"

            - name: DB_NAME
              value: payments

            - name: DB_USER
              value: postgres

            - name: DB_PASSWORD
              value: postgres

          ports:
            - name: http
              containerPort: 8080

          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: prod-demo-payment
  namespace: prod-demo
  labels:
    app: prod-demo-payment

spec:
  selector:
    app: prod-demo-payment

  ports:
    - name: http
      port: 8080
      targetPort: 8080
