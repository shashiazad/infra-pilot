apiVersion: apps/v1
kind: Deployment

metadata:
  name: prod-demo-payment
  namespace: prod-demo

spec:
  replicas: 2

  selector:
    matchLabels:
      app: prod-demo-payment

  template:
    metadata:
      labels:
        app: prod-demo-payment

    spec:
      containers:
        - name: prod-demo-payment
          image: python:3.12-slim

          command:
            - python
            - -u
            - -c
            - |
              import sys
              import time

              print(
                  "ERROR database connection timeout",
                  flush=True,
              )
              print(
                  "ERROR failed to process payment request",
                  flush=True,
              )
              time.sleep(2)
              sys.exit(1)
